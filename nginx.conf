server {
    listen 80;
    server_name _;

    # =========================
    # FRONTEND (React)
    # =========================
    root /home/ubuntu/allocation/static;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================
    # DJANGO API
    # =========================
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # DJANGO ADMIN
    # =========================
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # DJANGO STATIC (ADMIN)
    # =========================
    location /staticfiles/ {
        alias /home/ubuntu/allocation/staticfiles/;
    }

    # =========================
    # MEDIA FILES
    # =========================
    location /media/ {
        alias /home/ubuntu/allocation/media/;
    }

    client_max_body_size 50M;
}
